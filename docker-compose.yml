
version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: gestor_opiniones
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
     - "${DB_PORT}:5432"
    volumes:
      - gestor_opiniones_data:/var/lib/postgresql/data

volumes:
  gestor_opiniones_data:
